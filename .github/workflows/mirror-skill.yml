# skills/anew/SKILL.md is not edited here. It is composed by the source that also serves it, and this
# job copies the served bytes back into the repo — the first hand-written copy drifted within ten days,
# which is the whole reason the file is derived now.
#
# The copy is only as trustworthy as the fetch, so the bytes are checked against the digest the skills
# index publishes for them before anything is committed. A captive portal, an error page or a partial
# response fails that comparison and the job stops with the file untouched.
name: Mirror the served skill

on:
  schedule:
    # Daily. A skill change ships with a deploy, so the mirror is never more than a day behind it;
    # run the workflow by hand to close that gap immediately.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# One mirror at a time: a scheduled run and a manual one landing together would race on the push.
concurrency:
  group: mirror-skill

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the served skill and verify its published digest
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-all-errors -o skill.fetched \
            https://anew.page/.well-known/agent-skills/anew/SKILL.md
          curl -fsS --retry 3 --retry-all-errors -o index.fetched \
            https://anew.page/.well-known/agent-skills/index.json
          published=$(jq -er '.skills[] | select(.name == "anew") | .digest' index.fetched)
          actual="sha256:$(sha256sum skill.fetched | cut -d ' ' -f 1)"
          if [ "$published" != "$actual" ]; then
            echo "::error::the index publishes $published for anew, but the bytes served hash to $actual"
            exit 1
          fi
          mv skill.fetched skills/anew/SKILL.md
          rm index.fetched

      - name: Commit if the mirror moved
        run: |
          set -euo pipefail
          if git diff --quiet -- skills/anew/SKILL.md; then
            echo "the repo copy already is the served skill"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'skill: the repo copy is the served bytes' -- skills/anew/SKILL.md
          git push
